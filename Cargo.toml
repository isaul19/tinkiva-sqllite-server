[package]
name = "tinkiva-database"
version = "0.1.0"
edition = "2024"
description = "A lightweight multi-tenant serverless SQLite gateway"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6"
futures-util = "0.3"
http = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "net"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["catch-panic", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.21"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
