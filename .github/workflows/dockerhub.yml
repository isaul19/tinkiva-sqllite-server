name: Publicar imagen en Docker Hub

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dockerhub-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/tinkiva-sqllite-server:latest
            ${{ secrets.DOCKER_USER }}/tinkiva-sqllite-server:${{ github.sha }}
