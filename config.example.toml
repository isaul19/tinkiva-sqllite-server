[server]
# Keep this on loopback when using a reverse proxy.
bind = "127.0.0.1:7000"
auth_token = "change-me"
body_limit_bytes = 1048576
request_timeout_seconds = 30

[database]
directory = "./data/databases"
max_open_databases = 50
idle_timeout_seconds = 300
cleanup_interval_seconds = 30

# Requests never checkpoint; this is what bounds WAL growth.
checkpoint_interval_seconds = 10

# Read connections per database. One writer connection is always implied.
# Above 1 this trades tenant density for per-tenant read concurrency: each
# extra connection is another OS thread and another page cache.
reader_connections = 1
busy_timeout_ms = 5000
acquire_timeout_seconds = 10
max_result_rows = 10000

# Overload is shed as 429 instead of being absorbed as latency.
max_concurrent_requests = 512
max_concurrent_requests_per_database = 8
admission_timeout_ms = 50

# The writer touches fewer pages than result-producing readers. Separate
# budgets avoid paying the full reader cache twice for every hot tenant.
writer_cache_size_kb = 1024
reader_cache_size_kb = 512
# Per connection. Parameterized queries reuse entries; SQL text churn is
# evicted instead of growing to sqlx's default of 100 statements.
statement_cache_capacity = 16

# Mapped bytes per connection; file-backed and evictable, unlike page cache.
mmap_size_mb = 64
wal_size_limit_mb = 16
